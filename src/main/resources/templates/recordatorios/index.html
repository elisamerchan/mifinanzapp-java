<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Recordatorios')}"></head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div th:replace="~{fragments/header :: header('Recordatorios')}"></div>

        <div class="row g-4">
            <div class="col-12 col-lg-4">
                <div class="card-dashboard mb-4">
                    <div class="card-title mb-3">Nuevo recordatorio</div>
                    <form th:action="@{/recordatorios/guardar}" th:object="${recordatorio}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="titulo">Título</label>
                            <input type="text" id="titulo" th:field="*{titulo}" class="form-control form-custom" th:errorclass="is-invalid" maxlength="200" required>
                            <div class="invalid-feedback" th:errors="*{titulo}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="descripcion">Descripción</label>
                            <textarea id="descripcion" th:field="*{descripcion}" class="form-control form-custom" th:errorclass="is-invalid" rows="2" maxlength="500"></textarea>
                            <div class="invalid-feedback" th:errors="*{descripcion}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="fecha">Fecha</label>
                            <input type="date" id="fecha" th:field="*{fecha}" class="form-control form-custom" th:errorclass="is-invalid" required>
                            <div class="invalid-feedback" th:errors="*{fecha}"></div>
                        </div>
                        <button type="submit" class="btn-primary-custom w-100">Guardar</button>
                    </form>
                </div>
                <div class="card-dashboard">
                    <div class="card-title mb-3">📢 Próximos recordatorios</div>
                    <div th:if="${#lists.isEmpty(proximos)}" class="small-sec text-center p-3">
                        No hay recordatorios próximos
                    </div>
                    <div th:each="r : ${proximos}" class="d-flex align-items-start gap-2 mb-2 p-2 border-bottom">
                        <div aria-hidden="true">🔔</div>
                        <div>
                            <div class="fw-semibold small" th:text="${r.titulo}"></div>
                            <div class="small-sec" th:text="${#temporals.format(r.fecha, 'dd/MM/yyyy')}"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-lg-8">
                <div class="card-dashboard">
                    <div class="card-title mb-3">Mis recordatorios</div>
                    <div th:if="${#lists.isEmpty(recordatorios)}" class="empty-state">
                        <div class="empty-icon">&#128276;</div>
                        <p>No tienes recordatorios. Crea uno para no olvidar un pago.</p>
                    </div>
                    <div th:each="r : ${recordatorios}" class="mb-2 p-3 rounded-3 border"
                         th:classappend="${!r.completado and r.fecha.isBefore(hoy)} ? 'border-danger'">
                        <div class="d-flex justify-content-between gap-3">
                            <div th:classappend="${r.completado} ? 'text-decoration-line-through text-sec'">
                                <strong th:text="${r.titulo}"></strong>
                                <span th:if="${!r.completado and r.fecha.isBefore(hoy)}" class="badge-expense ms-1">Vencido</span>
                                <p class="mb-0 small-sec" th:text="${r.descripcion}"></p>
                            </div>
                            <div class="text-end text-nowrap">
                                <div class="small-sec" th:text="${#temporals.format(r.fecha, 'dd/MM/yyyy')}"></div>
                                <form th:action="@{/recordatorios/completar/{id}(id=${r.id})}" method="post" class="d-inline">
                                    <button type="submit" class="btn-accion" th:text="${r.completado} ? 'Reabrir' : 'Hecho'"></button>
                                </form>
                                <form th:action="@{/recordatorios/eliminar/{id}(id=${r.id})}" method="post" class="form-inline" onsubmit="return confirm('¿Eliminar este recordatorio?')">
                                    <button type="submit" class="btn-accion peligro">Eliminar</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
