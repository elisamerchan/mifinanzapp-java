<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Recordatorios')}"></head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div th:replace="~{fragments/header :: header('Recordatorios')}"></div>

        <div class="row g-4">
            <div class="col-12 col-lg-4">
                <div class="card-dashboard mb-4">
                    <div class="card-title mb-3">Nuevo recordatorio</div>
                    <form th:action="@{/recordatorios/guardar}" th:object="${recordatorio}" method="post">
                        <div class="mb-3">
                            <label class="form-label" style="font-size: 14px; font-weight: 500;">Título</label>
                            <input type="text" th:field="*{titulo}" class="form-control form-custom" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" style="font-size: 14px; font-weight: 500;">Descripción</label>
                            <textarea th:field="*{descripcion}" class="form-control form-custom" rows="2"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" style="font-size: 14px; font-weight: 500;">Fecha</label>
                            <input type="date" th:field="*{fecha}" class="form-control form-custom" required>
                        </div>
                        <button type="submit" class="btn-primary-custom w-100">Guardar</button>
                    </form>
                </div>
                <div class="card-dashboard">
                    <div class="card-title mb-3">📢 Próximos recordatorios</div>
                    <div th:if="${#lists.isEmpty(proximos)}" style="font-size: 13px; color: #7A7A7A; text-align: center; padding: 16px;">
                        No hay recordatorios próximos
                    </div>
                    <div th:each="r : ${proximos}" class="d-flex align-items-start gap-2 mb-2 p-2" style="border-bottom: 1px solid #F5F5F5;">
                        <div style="font-size: 18px;">🔔</div>
                        <div>
                            <div style="font-size: 13px; font-weight: 600;" th:text="${r.titulo}"></div>
                            <div style="font-size: 11px; color: #7A7A7A;" th:text="${r.fecha}"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-lg-8">
                <div class="card-dashboard">
                    <div class="card-title mb-3">Mis recordatorios</div>
                    <div th:if="${#lists.isEmpty(recordatorios)}" class="empty-state">
                        <p>No hay recordatorios</p>
                    </div>
                    <div th:each="r : ${recordatorios}" class="mb-2 p-3" style="border: 1px solid #F0F0F0; border-radius: 10px;">
                        <div class="d-flex justify-content-between">
                            <div>
                                <strong th:text="${r.titulo}"></strong>
                                <p class="mb-0" style="font-size: 13px; color: #7A7A7A;" th:text="${r.descripcion}"></p>
                            </div>
                            <div class="text-end">
                                <div style="font-size: 12px; color: #7A7A7A;" th:text="${r.fecha}"></div>
                                <a th:href="@{/recordatorios/eliminar/{id}(id=${r.id})}" class="btn btn-sm" style="color: #E53935;" onclick="return confirm('¿Eliminar?')">Eliminar</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
