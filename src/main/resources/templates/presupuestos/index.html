<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Presupuestos')}"></head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div th:replace="~{fragments/header :: header('Presupuesto mensual')}"></div>

        <div class="row g-4">
            <div class="col-12 col-lg-4">
                <div class="card-dashboard">
                    <div class="card-title mb-3" th:text="${presupuesto.id != null} ? 'Editar presupuesto' : 'Nuevo presupuesto'"></div>
                    <form th:action="@{/presupuestos/guardar}" th:object="${presupuesto}" method="post">
                        <input type="hidden" th:field="*{id}">
                        <div class="mb-3">
                            <label class="form-label" style="font-size: 14px; font-weight: 500;">Categoría</label>
                            <select th:field="*{categoria.id}" class="form-select form-custom" required>
                                <option value="">Seleccionar...</option>
                                <option th:each="cat : ${categoriasGasto}" th:value="${cat.id}" th:text="${cat.nombre}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" style="font-size: 14px; font-weight: 500;">Mes</label>
                            <select th:field="*{mes}" class="form-select form-custom" required>
                                <option th:each="i : ${#numbers.sequence(0, 11)}" th:value="${i + 1}" th:text="${meses[i]}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" style="font-size: 14px; font-weight: 500;">Año</label>
                            <input type="number" th:field="*{anio}" class="form-control form-custom" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" style="font-size: 14px; font-weight: 500;">Monto límite</label>
                            <input type="number" step="0.01" th:field="*{montoLimite}" class="form-control form-custom" required>
                        </div>
                        <button type="submit" class="btn-primary-custom w-100">
                            <span th:text="${presupuesto.id != null} ? 'Actualizar' : 'Guardar'"></span>
                        </button>
                        <a th:if="${presupuesto.id != null}" th:href="@{/presupuestos}" class="btn w-100 mt-2" style="border-radius: 10px; border: 1.5px solid #E0E0E0;">Cancelar</a>
                    </form>
                </div>
            </div>
            <div class="col-12 col-lg-8">
                <div class="card-dashboard">
                    <div class="card-title mb-3">Presupuestos definidos</div>
                    <div th:if="${#lists.isEmpty(presupuestos)}" class="empty-state">
                        <p>No hay presupuestos definidos</p>
                    </div>
                    <div th:if="${not #lists.isEmpty(presupuestos)}">
                        <div th:each="p : ${presupuestos}" class="mb-3 p-3" style="border: 1px solid #F0F0F0; border-radius: 10px;">
                            <div class="d-flex justify-content-between mb-1">
                                <span style="font-weight: 600;"><span th:text="${p.categoria.icono != null} ? ${p.categoria.icono} : ''"></span> <span th:text="${p.categoria.nombre}"></span></span>
                                <span style="font-size: 13px;" th:style="${p.excedido} ? 'color: #E53935; font-weight: 700;' : 'color: #7A7A7A;'" th:text="${'$' + #numbers.formatDecimal(p.gastado, 0, 'COMMA', 2, 'POINT') + ' / $' + #numbers.formatDecimal(p.montoLimite, 0, 'COMMA', 2, 'POINT')}"></span>
                            </div>
                            <div style="font-size: 12px; color: #7A7A7A;" th:text="${meses[p.mes - 1] + ' ' + p.anio}"></div>
                            <div class="mt-2">
                                <div class="progress-custom">
                                    <div class="progress-bar" role="progressbar"
                                         th:style="${'width: ' + (p.porcentaje > 100 ? 100 : p.porcentaje) + '%'}"
                                         th:classappend="${p.porcentaje > 90} ? 'bg-danger' : (${p.porcentaje > 70} ? 'bg-warning' : '')"
                                         th:styleappend="${p.porcentaje <= 70} ? 'background: #6E71C4;' : (${p.porcentaje > 90} ? 'background: #E53935;' : 'background: #FF9800;')"></div>
                                </div>
                                <div style="font-size: 11px; color: #7A7A7A; margin-top: 2px;" th:text="${p.porcentaje + '% utilizado'}"></div>
                            </div>
                            <div class="mt-2">
                                <a th:href="@{/presupuestos/editar/{id}(id=${p.id})}" class="btn btn-sm" style="color: #6E71C4;">Editar</a>
                                <a th:href="@{/presupuestos/eliminar/{id}(id=${p.id})}" class="btn btn-sm" style="color: #E53935;" onclick="return confirm('¿Eliminar presupuesto?')">Eliminar</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
