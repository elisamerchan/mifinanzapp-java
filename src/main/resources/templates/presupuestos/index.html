<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<!--/* Gestión de presupuestos mensuales por categoría y avance frente al gasto. Los formularios usan th:action para incluir el token CSRF. */-->
<head th:replace="~{fragments/head :: head('Presupuestos')}"></head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div th:replace="~{fragments/header :: header('Presupuesto mensual')}"></div>

        <div class="row g-4">
            <div class="col-12 col-lg-4">
                <div class="card-dashboard">
                    <div class="card-title mb-3" th:text="${presupuesto.id != null} ? 'Editar presupuesto' : 'Nuevo presupuesto'"></div>
                    <form th:action="@{/presupuestos/guardar}" th:object="${presupuesto}" method="post">
                        <input type="hidden" th:field="*{id}">
                        <div class="mb-3">
                            <label class="form-label" for="categoria">Categoría</label>
                            <select id="categoria" th:field="*{categoria.id}" class="form-select form-custom" required>
                                <option value="">Seleccionar...</option>
                                <option th:each="cat : ${categoriasGasto}" th:value="${cat.id}" th:text="${cat.nombre}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="mes">Mes</label>
                            <select id="mes" th:field="*{mes}" class="form-select form-custom" required>
                                <option th:each="i : ${#numbers.sequence(0, 11)}" th:value="${i + 1}" th:text="${meses[i]}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="anio">Año</label>
                            <input type="number" id="anio" th:field="*{anio}" class="form-control form-custom" th:errorclass="is-invalid" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="montoLimite">Monto límite</label>
                            <input type="number" step="0.01" min="0.01" id="montoLimite" th:field="*{montoLimite}" class="form-control form-custom" th:errorclass="is-invalid" required>
                            <div class="invalid-feedback" th:errors="*{montoLimite}"></div>
                        </div>
                        <button type="submit" class="btn-primary-custom w-100">
                            <span th:text="${presupuesto.id != null} ? 'Actualizar' : 'Guardar'"></span>
                        </button>
                        <a th:if="${presupuesto.id != null}" th:href="@{/presupuestos}" class="btn btn-outline-custom w-100 mt-2">Cancelar</a>
                    </form>
                </div>
            </div>
            <div class="col-12 col-lg-8">
                <div class="card-dashboard">
                    <div class="card-title mb-3">Presupuestos definidos</div>
                    <div th:if="${#lists.isEmpty(presupuestos)}" class="empty-state">
                        <p>No hay presupuestos definidos</p>
                    </div>
                    <div th:if="${not #lists.isEmpty(presupuestos)}">
                        <div th:each="p : ${presupuestos}" class="mb-3 p-3" style="border: 1px solid #F0F0F0; border-radius: 10px;">
                            <div class="d-flex justify-content-between mb-1">
                                <span style="font-weight: 600;"><span th:text="${p.categoria.icono != null} ? ${p.categoria.icono} : ''"></span> <span th:text="${p.categoria.nombre}"></span></span>
                                <span style="font-size: 13px;" th:classappend="${p.excedido} ? 'text-gasto' : 'text-sec'" th:text="${simbolo + #numbers.formatDecimal(p.gastado, 0, 'COMMA', 2, 'POINT') + ' / ' + simbolo + #numbers.formatDecimal(p.montoLimite, 0, 'COMMA', 2, 'POINT')}"></span>
                            </div>
                            <div style="font-size: 12px; color: #7A7A7A;" th:text="${meses[p.mes - 1] + ' ' + p.anio}"></div>
                            <div class="mt-2">
                                <div class="progress-custom">
                                    <div class="progress-bar" role="progressbar"
                                         th:classappend="${p.porcentaje > 90 ? 'bg-danger' : (p.porcentaje > 70 ? 'bg-warning' : '')}"
                                         th:style="${'width: ' + (p.porcentaje > 100 ? 100 : p.porcentaje) + '%; background: ' + (p.porcentaje <= 70 ? '#6E71C4' : (p.porcentaje > 90 ? '#E53935' : '#FF9800')) + ';'}"></div>
                                </div>
                                <div style="font-size: 11px; color: #7A7A7A; margin-top: 2px;" th:text="${p.porcentaje + '% utilizado'}"></div>
                            </div>
                            <div class="mt-2">
                                <a th:href="@{/presupuestos/editar/{id}(id=${p.id})}" class="btn-accion">Editar</a>
                                <form th:action="@{/presupuestos/eliminar/{id}(id=${p.id})}" method="post" class="form-inline" onsubmit="return confirm('¿Eliminar presupuesto?')"><button type="submit" class="btn-accion peligro">Eliminar</button></form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
