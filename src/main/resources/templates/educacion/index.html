<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Educación financiera')}"></head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div th:replace="~{fragments/header :: header('Contenido educativo')}"></div>

        <!-- Consejos según los datos del usuario -->
        <div class="card-dashboard mb-4" style="background: linear-gradient(135deg, #6E71C4, #2F3264); color: white;">
            <div class="small fw-semibold text-uppercase mb-2" style="opacity: .8;">💡 Para ti, este mes</div>
            <p th:each="c : ${consejos}" class="mb-2" th:text="${c}"></p>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-12 col-md-6 col-lg-4" th:each="a : ${articulos}">
                <a th:href="@{/educacion/{slug}(slug=${a.slug})}" class="text-decoration-none text-reset">
                    <div class="card-dashboard h-100">
                        <div class="fs-2 mb-2" aria-hidden="true" th:text="${a.icono}"></div>
                        <h2 class="h5 fw-bold" th:text="${a.titulo}"></h2>
                        <p class="small-sec" th:text="${a.resumen}"></p>
                        <span class="small text-primary" th:text="${'Leer · ' + a.minutos + ' min'}"></span>
                    </div>
                </a>
            </div>
        </div>

        <!-- Calculadora de ahorro: no guarda nada, todo ocurre en el navegador -->
        <div class="card-dashboard">
            <div class="card-title mb-3">🎯 Calculadora de meta de ahorro</div>
            <form id="calc-ahorro" class="row g-3 align-items-end" onsubmit="return false">
                <div class="col-12 col-md-3">
                    <label class="form-label" for="meta">Meta</label>
                    <input type="number" id="meta" min="1" step="0.01" class="form-control form-custom" value="1000">
                </div>
                <div class="col-12 col-md-3">
                    <label class="form-label" for="meses">Plazo (meses)</label>
                    <input type="number" id="meses" min="1" max="600" class="form-control form-custom" value="12">
                </div>
                <div class="col-12 col-md-3">
                    <label class="form-label" for="inicial">Ya tengo ahorrado</label>
                    <input type="number" id="inicial" min="0" step="0.01" class="form-control form-custom" value="0">
                </div>
                <div class="col-12 col-md-3">
                    <div class="small-sec">Debes ahorrar al mes</div>
                    <div class="fs-4 fw-bold text-ingreso" id="resultado-ahorro" aria-live="polite">—</div>
                </div>
            </form>
        </div>
    </div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
    <script th:inline="javascript">
        (function () {
            const simbolo = /*[[${simbolo}]]*/ '$';
            const f = document.getElementById('calc-ahorro');
            function calcular() {
                const meta = parseFloat(f.meta.value), meses = parseInt(f.meses.value, 10), inicial = parseFloat(f.inicial.value) || 0;
                const out = document.getElementById('resultado-ahorro');
                if (!(meta > 0) || !(meses > 0)) { out.textContent = '—'; return; }
                const falta = Math.max(meta - inicial, 0);
                out.textContent = simbolo + (falta / meses).toLocaleString('es-CO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }
            f.addEventListener('input', calcular);
            calcular();
        })();
    </script>
</body>
</html>
