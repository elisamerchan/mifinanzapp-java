<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Ingresos')}"></head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div th:replace="~{fragments/header :: header('Ingresos')}"></div>

        <div class="row g-4">
            <div class="col-12 col-lg-4">
                <div class="card-dashboard">
                    <div class="card-title mb-3" th:text="${ingreso.id != null} ? 'Editar ingreso' : 'Nuevo ingreso'"></div>
                    <form th:action="@{/ingresos/guardar}" th:object="${ingreso}" method="post">
                        <input type="hidden" th:field="*{id}">
                        <div class="mb-3">
                            <label class="form-label" style="font-size: 14px; font-weight: 500;">Monto</label>
                            <input type="number" step="0.01" th:field="*{monto}" class="form-control form-custom" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" style="font-size: 14px; font-weight: 500;">Categoría</label>
                            <select th:field="*{categoria.id}" class="form-select form-custom" required>
                                <option value="">Seleccionar...</option>
                                <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nombre}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" style="font-size: 14px; font-weight: 500;">Fecha</label>
                            <input type="date" th:field="*{fecha}" class="form-control form-custom" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" style="font-size: 14px; font-weight: 500;">Descripción</label>
                            <textarea th:field="*{descripcion}" class="form-control form-custom" rows="2"></textarea>
                        </div>
                        <button type="submit" class="btn-primary-custom w-100">
                            <span th:text="${ingreso.id != null} ? 'Actualizar' : 'Guardar'"></span>
                        </button>
                        <a th:if="${ingreso.id != null}" th:href="@{/ingresos}" class="btn w-100 mt-2" style="border-radius: 10px; border: 1.5px solid #E0E0E0;">Cancelar</a>
                    </form>
                </div>
            </div>
            <div class="col-12 col-lg-8">
                <div class="card-dashboard">
                    <div class="card-title mb-3">Mis ingresos</div>
                    <div class="table-responsive">
                        <table class="table table-dashboard">
                            <thead>
                                <tr><th>Fecha</th><th>Categoría</th><th>Descripción</th><th>Monto</th><th>Acciones</th></tr>
                            </thead>
                            <tbody>
                                <tr th:each="i : ${ingresos}">
                                    <td th:text="${i.fecha}"></td>
                                    <td th:text="${i.categoria.nombre}"></td>
                                    <td th:text="${i.descripcion}"></td>
                                    <td style="color: #4CAF50; font-weight: 600;" th:text="${'+$' + #numbers.formatDecimal(i.monto, 0, 'COMMA', 2, 'POINT')}"></td>
                                    <td>
                                        <a th:href="@{/ingresos/editar/{id}(id=${i.id})}" style="color: #6E71C4; font-size: 13px;">Editar</a>
                                        <a th:href="@{/ingresos/eliminar/{id}(id=${i.id})}" style="color: #E53935; font-size: 13px; margin-left: 8px;" onclick="return confirm('¿Eliminar?')">Eliminar</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
