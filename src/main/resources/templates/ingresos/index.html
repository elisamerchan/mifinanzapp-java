<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<!--/* Gestión de ingresos: formulario de alta/edición y listado con acciones. Los formularios usan th:action para incluir el token CSRF. */-->
<head th:replace="~{fragments/head :: head('Ingresos')}"></head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div th:replace="~{fragments/header :: header('Ingresos')}"></div>

        <div class="row g-4">
            <div class="col-12 col-lg-4">
                <div class="card-dashboard">
                    <div class="card-title mb-3" th:text="${ingreso.id != null} ? 'Editar ingreso' : 'Nuevo ingreso'"></div>
                    <form th:action="@{/ingresos/guardar}" th:object="${ingreso}" method="post">
                        <input type="hidden" th:field="*{id}">
                        <div class="mb-3">
                            <label class="form-label" for="monto">Monto</label>
                            <input type="number" step="0.01" min="0.01" id="monto" th:field="*{monto}" class="form-control form-custom" th:errorclass="is-invalid" required>
                            <div class="invalid-feedback" th:errors="*{monto}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="categoria">Categoría</label>
                            <select id="categoria" th:field="*{categoria.id}" class="form-select form-custom" required>
                                <option value="">Seleccionar...</option>
                                <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nombre}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="fecha">Fecha</label>
                            <input type="date" id="fecha" th:field="*{fecha}" class="form-control form-custom" th:errorclass="is-invalid" required>
                            <div class="invalid-feedback" th:errors="*{fecha}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="descripcion">Descripción</label>
                            <textarea id="descripcion" th:field="*{descripcion}" class="form-control form-custom" th:errorclass="is-invalid" rows="2" maxlength="255"></textarea>
                            <div class="invalid-feedback" th:errors="*{descripcion}"></div>
                        </div>
                        <button type="submit" class="btn-primary-custom w-100">
                            <span th:text="${ingreso.id != null} ? 'Actualizar' : 'Guardar'"></span>
                        </button>
                        <a th:if="${ingreso.id != null}" th:href="@{/ingresos}" class="btn btn-outline-custom w-100 mt-2">Cancelar</a>
                    </form>
                </div>
            </div>
            <div class="col-12 col-lg-8">
                <div class="card-dashboard">
                    <div class="card-title mb-3">Mis ingresos</div>
                    <div th:if="${#lists.isEmpty(ingresos)}" class="empty-state">
                        <div class="empty-icon">&#128176;</div>
                        <p>Aún no tienes ingresos registrados. Usa el formulario para añadir el primero.</p>
                    </div>
                    <div th:unless="${#lists.isEmpty(ingresos)}" class="table-responsive">
                        <table class="table table-dashboard">
                            <thead>
                                <tr><th>Fecha</th><th>Categoría</th><th>Descripción</th><th>Monto</th><th>Acciones</th></tr>
                            </thead>
                            <tbody>
                                <tr th:each="i : ${ingresos}">
                                    <td th:text="${#temporals.format(i.fecha, 'dd/MM/yyyy')}"></td>
                                    <td th:text="${i.categoria.nombre}"></td>
                                    <td th:text="${i.descripcion}"></td>
                                    <td class="text-ingreso" th:text="${'+' + simbolo + #numbers.formatDecimal(i.monto, 0, 'COMMA', 2, 'POINT')}"></td>
                                    <td>
                                        <a th:href="@{/ingresos/editar/{id}(id=${i.id})}" class="btn-accion">Editar</a>
                                        <form th:action="@{/ingresos/eliminar/{id}(id=${i.id})}" method="post" class="form-inline" onsubmit="return confirm('¿Eliminar este ingreso?')">
                                            <button type="submit" class="btn-accion peligro">Eliminar</button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div th:replace="~{fragments/paginacion :: paginacion(${pagina}, ${totalPaginas}, '/ingresos')}"></div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
