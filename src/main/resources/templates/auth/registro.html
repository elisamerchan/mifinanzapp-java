<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - Mi FinanzApp</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/components/cards.css}">
    <link rel="stylesheet" th:href="@{/css/components/forms.css}">
    <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-11 col-sm-8 col-md-6 col-lg-4">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center" style="width: 64px; height: 64px; background: #6E71C4; border-radius: 16px;">
                        <span style="color: white; font-weight: 700; font-size: 24px;">M</span>
                    </div>
                    <h2 class="mt-3" style="color: #2B2B2B;">Crear cuenta</h2>
                    <p style="color: #7A7A7A;">Regístrate para gestionar tus finanzas</p>
                </div>

                <div class="card" style="border: none; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);">
                    <div class="card-body p-4">

                        <div th:if="${error != null}" class="alert alert-danger py-2" style="border-radius: 10px; font-size: 14px;" th:text="${error}"></div>

                        <form th:action="@{/auth/registro}" th:object="${usuario}" method="post">
                            <div class="mb-3">
                                <label class="form-label" style="color: #2B2B2B; font-weight: 500; font-size: 14px;">Nombre</label>
                                <input type="text" th:field="*{nombre}" class="form-control" placeholder="Tu nombre" style="border-radius: 10px; padding: 10px 14px; border: 1.5px solid #E0E0E0;">
                                <div th:if="${#fields.hasErrors('nombre')}" class="text-danger" style="font-size: 12px;" th:errors="*{nombre}"></div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" style="color: #2B2B2B; font-weight: 500; font-size: 14px;">Email</label>
                                <input type="email" th:field="*{email}" class="form-control" placeholder="tu@email.com" style="border-radius: 10px; padding: 10px 14px; border: 1.5px solid #E0E0E0;">
                                <div th:if="${#fields.hasErrors('email')}" class="text-danger" style="font-size: 12px;" th:errors="*{email}"></div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" style="color: #2B2B2B; font-weight: 500; font-size: 14px;">Contraseña</label>
                                <input type="password" th:field="*{password}" class="form-control" placeholder="Mínimo 6 caracteres" style="border-radius: 10px; padding: 10px 14px; border: 1.5px solid #E0E0E0;">
                                <div th:if="${#fields.hasErrors('password')}" class="text-danger" style="font-size: 12px;" th:errors="*{password}"></div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" style="color: #2B2B2B; font-weight: 500; font-size: 14px;">Confirmar contraseña</label>
                                <input type="password" th:field="*{confirmarPassword}" class="form-control" placeholder="Repite la contraseña" style="border-radius: 10px; padding: 10px 14px; border: 1.5px solid #E0E0E0;">
                            </div>
                            <button type="submit" class="btn w-100 py-2" style="background: #6E71C4; color: white; border-radius: 10px; font-weight: 600; border: none;">
                                Crear cuenta
                            </button>
                        </form>

                        <p class="text-center mt-3 mb-0" style="color: #7A7A7A; font-size: 14px;">
                            ¿Ya tienes cuenta?
                            <a th:href="@{/auth/login}" style="color: #6E71C4; text-decoration: none; font-weight: 500;">Inicia sesión</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
